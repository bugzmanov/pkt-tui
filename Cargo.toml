[package]
name = "pkt-tui"
version = "0.1.0"
edition = "2021"

[lib]
name = "pkt_tui"
path = "src/lib.rs"

[[bin]]
name = "pkt-tui"
path = "src/main.rs"

[[bin]]
name = "test_raindrop"
path = "src/bin/test_raindrop.rs"

[[bin]]
name = "raindrop_tui"
path = "src/bin/raindrop_tui.rs"

[dependencies]
crossterm = "0.27.0"
ratatui = "0.29"
unicode-width = "0.1"
itertools = "0.12"
webbrowser = "0.8.13"
chrono = "0.4.35"
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"
tui-textarea = "0.7.0"
reqwest = { version = "0.12.2", features = ["json", "blocking"] }

image = "0.25"

# Alternatives that are very hard to use:
# pdf = "0.9.0"
# pdf-extract = "0.8.0"
lopdf = "0.34"
anyhow = "1.0.81"
thiserror = "1.0.58"
color-eyre = "0.6.3"
tokio = { version = "1.36.0", features = ["full"] }
env_logger = "0.11.3"
log = "0.4.21"
cli-clipboard = "0.4"
rss = "2.0"
atom_syndication = "0.12"
rayon = "1.8"
dom_smoothie = "0.6.1"
sanitize-filename = "0.6.0"
fast_html2md = "0.0.47"
toml = "0.8"
epub-builder = "0.7"
scraper = "0.21"
base64 = "0.22"
url = "2"
urlencoding = "2"
dirs = "5"
zip = "2"
regex = "1"
headless_chrome = "1"
pulldown-cmark = { version = "0.12", features = ["html"] }

[dev-dependencies]
tempfile = "3.10.1"
